<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Odds: everyday cotton socks for men, women and kids, made in Egypt. Store design preview by band.">
<meta property="og:title" content="Odds · Store preview">
<meta property="og:description" content="Everyday cotton socks for men, women and kids, made in Egypt. A working store design preview.">
<meta property="og:image" content="https://band-agents.github.io/odds-website/img/op3a-2-p.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#8e1a1d">
<title>Odds Comfort Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: 01 Comfort, grown into a working store. White shelf, dark-red signature panel, real photos on warm tiles, every control live. */
:root{
  --bg:#ffffff; --tile:#f6f4f2; --studio:#efefed; --fg:#171717; --muted:#6b6663; --line:#e8e4e0;
  --red:#e8232a; --red-dark:#8e1a1d; --red-soft:#ffb3b5; --ok:#1f7a4d;
  --display:'Poppins',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif; --ar:'Tajawal','Poppins',sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1); --off:100%;
  color-scheme:light;
}
:root[dir="rtl"]{--display:'Tajawal',system-ui,sans-serif;--body:'Tajawal',system-ui,sans-serif;--off:-100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
.no-anim,.no-anim *{transition:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:20px}
.ar{font-family:var(--ar)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
:root[dir="rtl"] .eyebrow{letter-spacing:0;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-height:48px;padding:0 26px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:15px;border:2px solid var(--fg);background:var(--fg);color:#fff;transition:transform .2s var(--ease),background .2s,color .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.white{background:#fff;border-color:#fff;color:var(--red-dark)}
.btn.outline{background:transparent;border-color:#fff;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;position:relative;transition:background .2s}
.icon-btn:hover{background:var(--tile)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.dot-count{position:absolute;top:4px;inset-inline-end:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--display);font-size:11px;font-weight:600;display:grid;place-items:center;transition:transform .3s var(--ease)}
.dot-count.bump{transform:scale(1.35)}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

/* announcement */
.bar{background:var(--fg);color:#fff;font-family:var(--display);font-size:14px;height:38px;overflow:hidden;position:relative}
.bar p{margin:0;position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;text-align:center;transition:transform .5s var(--ease),opacity .5s}
.bar p.out{transform:translateY(-100%);opacity:0}
.bar p.in{transform:translateY(100%);opacity:0}
.bar b{color:var(--red-soft);font-weight:600}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
header.scrolled{border-color:var(--line);box-shadow:0 6px 24px -18px rgba(0,0,0,.35)}
.nav{display:flex;align-items:center;gap:22px;min-height:70px}
.logo{font-family:'Poppins',sans-serif;font-weight:700;font-size:31px;letter-spacing:-.06em;color:var(--red);line-height:1;display:inline-flex;align-items:baseline}
.logo i{display:inline-block;width:.24em;height:.24em;border-radius:50%;background:var(--red);margin-inline-start:.04em;font-style:normal}
.menu{display:none;list-style:none;margin:0;padding:0;gap:6px;font-family:var(--display);font-weight:500;font-size:15px}
.menu button,.menu a{background:none;border:0;padding:10px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;transition:background .2s}
.menu button:hover,.menu a:hover,.menu button[aria-expanded="true"]{background:var(--tile)}
.menu svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.menu button[aria-expanded="true"] svg{transform:rotate(180deg)}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:2px}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;height:36px;padding:0 12px;font-family:var(--display);font-weight:600;font-size:13px;margin-inline-end:6px;display:inline-flex;align-items:center;gap:6px}
.lang span{opacity:.4}.lang span.on{opacity:1}
.burger{display:grid}
@media(min-width:1000px){.menu{display:flex}.burger{display:none}}

/* mega menu */
.mega{position:absolute;inset-inline:0;top:100%;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 30px 40px -30px rgba(0,0,0,.25);opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s,transform .25s var(--ease),visibility .25s}
.mega.open{opacity:1;visibility:visible;transform:none}
.mega .in{display:grid;grid-template-columns:220px 1fr 1fr 1.1fr;gap:28px;padding-block:28px 34px}
.mega h4{margin:0 0 12px;font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mega ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mega ul button{background:none;border:0;padding:8px 0;font-family:var(--display);font-size:17px;font-weight:500;display:flex;justify-content:space-between;width:100%;text-align:start}
.mega ul button:hover{color:var(--red)}
.mega ul small{color:var(--muted);font-size:13px;font-weight:400}
.mega .feat{display:grid;gap:10px;background:none;border:0;padding:0;text-align:start}
.mega .feat .ph{background:var(--tile);border-radius:14px;aspect-ratio:1;overflow:hidden}
.mega .feat img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;transition:transform .5s var(--ease)}
.mega .feat:hover img{transform:scale(1.05)}
.mega .feat b{font-family:var(--display);font-weight:600;font-size:15px}
.mega .feat span{font-size:14px;color:var(--muted)}
.mega .promo{border-radius:16px;overflow:hidden;background:var(--red-dark);color:#fff;display:grid;grid-template-rows:1fr auto;border:0;padding:0;text-align:start}
.mega .promo img{width:100%;height:100%;object-fit:cover;min-height:0}
.mega .promo div{padding:16px 18px;display:grid;gap:4px}
.mega .promo b{font-family:var(--display);font-size:18px}

/* search overlay */
.search{position:fixed;inset:0;z-index:70;background:rgba(23,23,23,.4);backdrop-filter:blur(6px);display:grid;align-items:start;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.search.open{opacity:1;visibility:visible}
.search .panel{background:#fff;padding-block:22px 28px;transform:translateY(-20px);transition:transform .35s var(--ease)}
.search.open .panel{transform:none}
.search .field{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:10px}
.search input{flex:1;border:0;outline:0;font-family:var(--display);font-size:clamp(22px,3vw,32px);font-weight:500;background:none;min-width:0}
.search .pop{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:38px;padding:0 15px;font-family:var(--display);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:20px;max-height:56vh;overflow:auto}
.res{border:0;background:none;padding:0;text-align:start;display:grid;gap:6px}
.res .ph{background:var(--tile);border-radius:12px;aspect-ratio:1;overflow:hidden}
.res img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.res b{font-family:var(--display);font-size:14px;font-weight:600}
.res span{font-size:13px;color:var(--muted)}

/* hero */
.hero{position:relative;border-radius:24px;overflow:hidden;margin-block:18px 0;display:grid;background:var(--studio);min-height:0}
.slides{display:grid}
.slide{grid-area:1/1;display:grid;opacity:0;visibility:hidden;transition:opacity .8s var(--ease),visibility .8s}
.slide.on{opacity:1;visibility:visible}
.slide .pic{position:relative;overflow:hidden;min-height:340px;background:var(--studio)}
.slide .pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 6.5s linear}
.slide.on .pic>img{transform:scale(1)}
.floater{position:absolute;inset-inline-start:18px;bottom:18px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:16px;padding:10px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 36px);box-shadow:0 18px 40px -20px rgba(0,0,0,.45);border:0;text-align:start;transform:translateY(16px);opacity:0;transition:transform .6s .35s var(--ease),opacity .6s .35s}
.slide.on .floater{transform:none;opacity:1}
.floater .ph{width:66px;height:66px;border-radius:10px;background:var(--tile);overflow:hidden;flex:none}
.floater .ph img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.floater b{display:block;font-family:var(--display);font-size:14px;font-weight:600}
.floater span{font-size:14px;color:var(--muted)}
.floater .plus{width:34px;height:34px;border-radius:50%;background:var(--fg);color:#fff;display:grid;place-items:center;flex:none;font-size:20px;line-height:1}
.slide .copy{background:var(--red-dark);color:#fff;padding:38px 28px 92px;display:grid;gap:16px;align-content:center}
.slide .copy>*{transform:translateY(14px);opacity:0;transition:transform .7s var(--ease),opacity .7s}
.slide.on .copy>*{transform:none;opacity:1}
.slide.on .copy>*:nth-child(2){transition-delay:.08s}.slide.on .copy>*:nth-child(3){transition-delay:.16s}.slide.on .copy>*:nth-child(4){transition-delay:.24s}.slide.on .copy>*:nth-child(5){transition-delay:.32s}
.slide .eyebrow{color:var(--red-soft)}
.slide h1{font-size:clamp(36px,5vw,62px);font-weight:700;letter-spacing:-.02em}
:root[dir="rtl"] .slide h1{letter-spacing:0;font-weight:800}
.slide p{margin:0;font-size:19px;max-width:40ch;opacity:.9}
.slide .actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-ctrl{position:absolute;inset-inline-end:24px;bottom:24px;display:flex;align-items:center;gap:14px;z-index:2}
.bars{display:flex;gap:6px}
.bars button{width:42px;height:22px;border:0;background:none;padding:0;display:grid;align-items:center}
.bars i{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
.bars i::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
:root[dir="rtl"] .bars i::after{transform-origin:right}
.bars button.done i::after{transform:scaleX(1)}
.bars button.on i::after{animation:fill var(--dur,6s) linear forwards}
.hero.paused .bars button.on i::after{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.arrow{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;display:grid;place-items:center;transition:background .2s}
.arrow:hover{background:rgba(255,255,255,.14)}
.arrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
:root[dir="rtl"] .arrow svg{transform:scaleX(-1)}
@media(min-width:960px){.slide{grid-template-columns:1.2fr 1fr}.slide .pic{min-height:560px}.slide .copy{padding:48px 48px 100px}}

/* category strip */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-block:18px}
.cat{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:16px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:600;font-size:15px;border:0;text-align:start;transition:background .2s,transform .25s var(--ease)}
:root[dir="rtl"] .cat{padding:8px 8px 8px 16px}
.cat:hover{background:#efebe7;transform:translateY(-2px)}
.cat .ph{width:58px;height:58px;border-radius:12px;overflow:hidden;flex:none;background:#fff}
.cat img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.cat small{display:block;font-weight:400;color:var(--muted);font-size:13px}
@media(min-width:760px){.cats{grid-template-columns:repeat(4,1fr)}}

.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;border-block:1px solid var(--line);padding-block:24px;margin-block:30px 70px}
.trust div{display:grid;gap:3px}
.trust b{font-family:var(--display);font-size:15px}
.trust span{font-size:15px;color:var(--muted)}
@media(min-width:760px){.trust{grid-template-columns:repeat(4,1fr)}}

section{margin-bottom:90px;scroll-margin-top:90px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2{font-size:clamp(26px,3.2vw,38px);font-weight:600;letter-spacing:-.02em}
:root[dir="rtl"] .sec-head h2{letter-spacing:0;font-weight:700}
.sec-head p{margin:6px 0 0;color:var(--muted)}

/* shop toolbar: one slim bar, tabs + dropdown facets */
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:20;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);margin-bottom:24px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--tile);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;min-height:36px;padding:0 16px;font-family:var(--display);font-weight:500;font-size:14px;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--fg);color:#fff}
.tb{display:flex;align-items:center;gap:0 18px;flex-wrap:wrap}
.tabs{position:relative;order:1;align-self:stretch}
.tablist{display:flex;gap:24px}
.tablist button{border:0;background:none;padding:0;min-height:58px;font-family:var(--display);font-weight:500;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;transition:color .2s}
.tablist button:hover,.tablist button[aria-selected="true"]{color:var(--fg)}
.tablist sup{font-size:10px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;transition:color .2s}
.tablist button[aria-selected="true"] sup{color:var(--red)}
.ink{position:absolute;bottom:-1px;left:0;height:2px;width:0;background:var(--fg);border-radius:2px;transition:transform .45s var(--ease),width .45s var(--ease)}
.facets{order:2;margin-inline-start:auto;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.facets::-webkit-scrollbar{display:none}
.facet{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding-inline:15px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-family:var(--display);font-size:14px;font-weight:500;transition:border-color .2s,background .2s,color .2s}
.facet:hover{border-color:var(--fg)}
.facet>svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .3s var(--ease)}
.facet[aria-expanded="true"]>svg{transform:rotate(180deg)}
.facet.on{background:var(--fg);border-color:var(--fg);color:#fff}
.facet .val{font-weight:400;opacity:.72;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facet .dots{display:inline-flex;padding-inline-start:4px}
.facet .dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--fg);margin-inline-start:-5px}
.facet.sort{border-color:transparent;padding-inline:10px 8px}
.facet.sort:hover{background:var(--tile)}
.facet.sort .val{opacity:1;font-weight:600}
.clearf{flex:none;border:0;background:none;height:38px;padding:0 6px;font-family:var(--display);font-size:13px;font-weight:600;color:var(--red);animation:rise .3s var(--ease)}
.tb-end{order:3;display:flex;align-items:center;gap:12px}
.count{font-family:var(--display);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.views{display:none}
@media(min-width:900px){.views{display:inline-flex}}
.views button svg{width:16px;height:16px;fill:currentColor}
@media(max-width:899px){.tb-end{order:2;margin-inline-start:auto}.facets{order:3;flex-basis:100%;margin-inline-start:0;padding-block:0 12px}.tablist{gap:20px}}

/* facet popover; a bottom sheet on phones */
.fpop{position:fixed;z-index:45;width:330px;max-width:calc(100vw - 24px);background:#fff;border-radius:20px;padding:8px;box-shadow:0 30px 60px -24px rgba(0,0,0,.38),0 0 0 1px rgba(0,0,0,.05);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top center;transition:opacity .22s,transform .3s var(--ease),visibility .3s}
.fpop.on{opacity:1;visibility:visible;transform:none}
.fpop h4{margin:0;padding:10px 12px 6px;font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
:root[dir="rtl"] .fpop h4{letter-spacing:0;font-size:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:none;border-radius:12px;font-family:var(--display);font-size:15px;text-align:start;transition:background .15s}
.opt:hover:not([disabled]){background:var(--tile)}
.opt[disabled]{opacity:.35;cursor:default}
.opt .box{width:20px;height:20px;flex:none;border-radius:6px;border:1.5px solid #cdc6bf;display:grid;place-items:center;transition:background .2s,border-color .2s}
.opt .box svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease)}
.opt[aria-pressed="true"] .box{background:var(--fg);border-color:var(--fg)}
.opt[aria-pressed="true"] .box svg{stroke-dashoffset:0}
.opt.radio .box{border-radius:50%}
.opt.radio[aria-pressed="true"] .box{background:#fff;border:6px solid var(--fg)}
.opt .n{margin-inline-start:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.opt .h{width:9px;height:24px;flex:none;border-radius:3px;background:var(--tile);position:relative;overflow:hidden}
.opt .h i{position:absolute;inset-inline:0;bottom:0;background:var(--red);border-radius:3px}
.opt .pp{font-size:13px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:4px}
.copt{border:0;background:none;display:grid;justify-items:center;gap:6px;padding:10px 2px 8px;border-radius:14px;font-family:var(--display);font-size:12px;font-weight:500;transition:background .15s}
.copt:hover:not([disabled]){background:var(--tile)}
.copt[disabled]{opacity:.3;cursor:default}
.copt i{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.12);transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.copt[aria-pressed="true"] i{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--fg);transform:scale(.9)}
.copt small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;margin-top:-4px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:6px;padding:10px 4px 2px}
.pfoot .reset{border:0;background:none;font-family:var(--display);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px}
.pfoot .reset[disabled]{opacity:.35;cursor:default}
.pfoot .btn{min-height:42px;padding:0 18px;font-size:14px}
.fscrim{display:none}
@media(max-width:699px){
  .fpop{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;border-radius:24px 24px 0 0;padding:6px 12px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .4s var(--ease),visibility .4s,opacity .2s}
  .fpop::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#ddd6d0;margin:6px auto 4px}
  .fpop.on{transform:none}

/* product grid */

.badge{position:absolute;top:12px;inset-inline-start:12px;z-index:2;background:var(--red);color:#fff;font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px}

@keyframes pop{50%{transform:scale(1.35)}}
.quick{position:absolute;inset-inline:12px;bottom:12px;z-index:2;min-height:44px;border:0;border-radius:999px;background:var(--fg);color:#fff;font-family:var(--display);font-weight:600;font-size:14px;transform:translateY(140%);transition:transform .35s var(--ease)}

.card h3{font-size:16px;font-weight:600;cursor:pointer}

.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--muted);align-items:baseline}
.price{font-family:var(--display);font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}

/* height guide */
.height{display:grid;gap:28px;align-items:center;background:var(--tile);border-radius:26px;padding:24px;overflow:hidden}

/* pack builder */
.builder{display:grid;gap:30px;background:var(--fg);color:#fff;border-radius:26px;padding:28px 22px;position:relative;overflow:hidden}
.builder::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(232,35,42,.55),transparent 65%);inset-inline-end:-180px;top:-200px;pointer-events:none}

.slot{aspect-ratio:3/4;border-radius:18px;position:relative;overflow:hidden;display:grid;place-items:center;border:0;padding:0;color:inherit}

// skip: ignore one facet, so option counts show what you'd get by picking it
function matches(p,skip){return (skip==='who'||S.who==='all'||p.who===S.who)&&(skip==='cut'||!S.cut.size||S.cut.has(p.cut))&&(skip==='pack'||!S.pack.size||S.pack.has(p.pairs))&&(skip==='fam'||!S.fam.size||p.fam.some(f=>S.fam.has(f)))}
const hasVal=(p,f,v)=>f==='cut'?p.cut===v:f==='pack'?p.pairs===v:p.fam.includes(v);
const optCount=(f,v)=>P.filter(p=>matches(p,f)&&hasVal(p,f,v)).length;
const optLabel=(f,v)=>f==='cut'?t(v):f==='pack'?t('pairs',v):famLabel(v);
function filtered(){
  let r=P.filter(p=>matches(p));
  const s={featured:(a,b)=>a.rank-b.rank,low:(a,b)=>a.price-b.price||a.rank-b.rank,high:(a,b)=>b.price-a.price||a.rank-b.rank,name:(a,b)=>pname(a).localeCompare(pname(b),lang)}[S.sort];
  return r.sort(s);
}
const FACETS={cut:{k:'cut',opts:()=>CUTS},pack:{k:'pack',opts:()=>[3,5,6]},fam:{k:'colour',opts:()=>Object.keys(FAMS)}};
const CHECK='<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

    else if(sel.length)val=`<span class="val">${optLabel(f,sel[0])}${sel.length>1?` +${sel.length-1}`:''}</span>`;
    return `<button class="facet${sel.length?' on':''}" data-facet="${f}" aria-haspopup="dialog" aria-expanded="${openF===f}"><span>${t(FACETS[f].k)}</span>${val}<svg><use href="#i-down"/></svg></button>`;
  }).join('')+(any?`<button class="clearf" id="clearAll">${t('clearAll')}</button>`:'')+

function ink(){const a=$('#who [aria-selected="true"]'),i=$('#ink');if(!a)return;i.style.width=a.offsetWidth+'px';i.style.transform=`translateX(${a.offsetLeft}px)`}
function renderPop(){
  const pop=$('#fpop');
  pop.classList.toggle('on',!!openF);$('#fscrim').classList.toggle('on',!!openF);
  if(!openF)return;
  let body='';
  if(openF==='sort'){
    body=`<h4>${t('sortBy')}</h4>`+['featured','low','high','name'].map(s=>`<button class="opt radio" data-sort="${s}" aria-pressed="${S.sort===s}"><span class="box"></span><span>${t(s)}</span></button>`).join('');
  }else{
    const f=openF,opts=FACETS[f].opts();
    body=`<h4>${t(FACETS[f].k)}</h4>`;
    if(f==='fam'){
      body+=`<div class="cgrid">${opts.map(v=>{const n=optCount(f,v),on=S.fam.has(v);return `<button class="copt" data-g="fam" data-v="${v}" aria-pressed="${on}"${n||on?'':' disabled'}><i style="background:${FAMS[v]}"></i>${famLabel(v)}<small>${n}</small></button>`}).join('')}</div>`;
    }else{
      body+=opts.map(v=>{const n=optCount(f,v),on=S[f].has(v);
        const lead=f==='cut'?`<span class="h"><i style="height:${HH[v]}%"></i></span>`:'';
        const list=P.filter(p=>matches(p,f)&&hasVal(p,f,v));
        const sub=f==='pack'&&list.length?`<span class="pp">${t('perPair',Math.round(Math.min(...list.map(p=>p.price/p.pairs))))}</span>`:'';
        return `<button class="opt" data-g="${f}" data-v="${v}" aria-pressed="${on}"${n||on?'':' disabled'}><span class="box">${CHECK}</span>${lead}<span>${optLabel(f,v)}</span>${sub}<span class="n">${n}</span></button>`}).join('');
    }
    body+=`<div class="pfoot"><button class="reset" data-reset="${f}"${S[f].size?'':' disabled'}>${t('clear')}</button><button class="btn" data-done>${t('showN',filtered().length)}</button></div>`;

function placePop(){
  const b=$(`[data-facet="${openF}"]`),pop=$('#fpop');if(!b||!openF)return;
  if(innerWidth<700){pop.style.left='';pop.style.top='';return}
  const r=b.getBoundingClientRect(),w=pop.offsetWidth;
  let x=lang==='ar'?r.right-w:r.left;x=Math.max(12,Math.min(x,innerWidth-w-12));
  pop.style.left=x+'px';pop.style.top=(r.bottom+10)+'px';
}
function setPop(f){openF=f;renderToolbar();if(f)setTimeout(()=>{const o=$('#fpop button:not([disabled])');o&&o.focus({preventScroll:true})},60)}

const BCOL={black:['#1b1b1b','Black','أسود'],white:['#f4f4f4','White','أبيض'],grey:['#9a9a9a','Grey','رمادي'],light:['#d9d9d9','Light grey','رمادي فاتح'],charcoal:['#4a4a4a','Charcoal','فحمي'],navy:['#23315e','Navy','كحلي'],rose:['#d96d7d','Rose','وردي'],sage:['#a9c7b8','Sage','أخضر فاتح'],red:['#c62828','Red block','بلوك أحمر']};
const BIMG={
  crew:{black:'op5b-m-1-3',white:'op3b-1-2',grey:'op3b-1-3',light:'op5b-m-1-2',charcoal:'op5b-m-1-4',navy:'op5b-m-1-1',rose:'op3w-s-1-2'},
  ankle:{black:'op6n-b-105-1',white:'op6n-b-100-1',grey:'op5n-s-1-1',light:'op5n-s-1-2',navy:'op3n-120-1',rose:'op3i-s-1-1',sage:'op3i-p-1-2',red:'op3e-p-1-1'},
  noshow:{black:'op3g-s-1-1',grey:'op3g-s-1-2',white:'op3g-s-1-3',navy:'op3g-p-1-3',rose:'op3k-p-2-2'}
};
const colName=k=>BCOL[k]?BCOL[k][lang==='ar'?2:1]:k;
const PRICE={3:249,5:369,6:429};
const B={size:3,cut:'crew',slots:[]};
function renderBuilder(){
  $('#bSize').innerHTML=[3,5,6].map(n=>`<button data-size="${n}" aria-pressed="${B.size===n}">${t('pairs',n)}</button>`).join('');
  $('#bCut').innerHTML=['crew','ankle','noshow'].map(c=>`<button data-bcut="${c}" aria-pressed="${B.cut===c}">${t(c)}</button>`).join('');
  renderSlots();
}
function renderSlots(){
  B.slots=B.slots.filter(k=>BIMG[B.cut][k]).slice(0,B.size);
  const full=B.slots.length>=B.size;
  $('#palette').innerHTML=Object.keys(BIMG[B.cut]).map(k=>{const n=B.slots.filter(x=>x===k).length;
    return `<button style="background:${BCOL[k][0]}" data-col="${k}" title="${colName(k)}" aria-label="${colName(k)}"${full?' disabled':''}>${n?`<b>${n}</b>`:''}</button>`}).join('');
  const el=$('#slots');el.className='slots n'+B.size;
  const ghost=`img/${BIMG[B.cut].black}.jpg`;
  el.innerHTML=Array.from({length:B.size},(_,i)=>{const k=B.slots[i];
    return k?`<button class="slot filled" data-rm="${i}" aria-label="${t('remove')} ${colName(k)}"><img src="img/${BIMG[B.cut][k]}.jpg" alt=""><span class="num">${i+1}</span><span class="x" aria-hidden="true">×</span><span class="cn">${colName(k)}</span></button>`
      :`<div class="slot vacant${i===B.slots.length?' next':''}"><img src="${ghost}" alt=""><span>${i+1}</span></div>`}).join('');
  const per3=PRICE[3]/3,fullPrice=Math.round(per3*B.size),price=PRICE[B.size],sv=fullPrice-price;
  $('#bPrice').innerHTML=`${money(price)}${sv>0?`<small>${t('save',sv)}</small>`:''}`;
  const left=B.size-B.slots.length,btn=$('#bAdd');btn.disabled=left>0;btn.textContent=left>0?t('fillMore',left):t('addPack');
}
$('#build').addEventListener('click',e=>{
  const s=e.target.closest('[data-size]');if(s){B.size=+s.dataset.size;renderBuilder();return}
  const c=e.target.closest('[data-bcut]');if(c){B.cut=c.dataset.bcut;renderBuilder();return}
  const col=e.target.closest('[data-col]');if(col&&!col.disabled){if(B.slots.length<B.size){B.slots.push(col.dataset.col);renderSlots()}return}
  const rm=e.target.closest('[data-rm]');if(rm){B.slots.splice(+rm.dataset.rm,1);renderSlots();return}
});
$('#bRandom').onclick=()=>{const keys=Object.keys(BIMG[B.cut]);B.slots=Array.from({length:B.size},()=>keys[Math.floor(Math.random()*keys.length)]);renderSlots()};
$('#bAdd').onclick=()=>{if(B.slots.length<B.size)return;S.bag.push({key:'pack-'+Date.now(),custom:{size:B.size,cut:B.cut,cols:[...B.slots]},price:PRICE[B.size],qty:1});B.slots=[];renderSlots();bagChanged();toast(t('added'),t('view'),()=>openDrawer('bag'))};

/* ---------- facts ---------- */
function renderFacts(){
  const F=[[85,'%','f1'],[P.length,'','f2'],[4,'','f3'],[1,'','f4']];
  $('#facts').innerHTML=F.map(([n,u,k])=>`<div class="fact"><div class="big" data-n="${n}" data-u="${u}">${n}${u}</div><p>${t(k)}</p></div>`).join('');
  if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;io.unobserve(en.target);const el=en.target,n=+el.dataset.n,u=el.dataset.u,t0=performance.now();
      const step=now=>{const k=Math.min(1,(now-t0)/1100),v=Math.round(n*(1-Math.pow(1-k,3)));el.textContent=v+u;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}),{threshold:.6});
    $$('.fact .big').forEach(e=>io.observe(e));
  }
}

/* ---------- bag & saved ---------- */
function addToBag(id,sw=0,qty=1){const key=id+'|'+sw,l=S.bag.find(x=>x.key===key);l?l.qty+=qty:S.bag.push({key,id,sw,qty});bagChanged();toast(t('added'),t('view'),()=>openDrawer('bag'))}
function lineInfo(l){
  if(l.custom)return{name:t('customPack'),sub:`${t(l.custom.cut)} · ${t('pairs',l.custom.size)}`,price:l.price,ph:`<span class="ph pack">${l.custom.cols.map(k=>{const im=BIMG[l.custom.cut]&&BIMG[l.custom.cut][k];return im?`<img src="img/${im}.jpg" alt="">`:`<i style="background:${BCOL[k]?BCOL[k][0]:k}"></i>`}).join('')}</span>`};
  const p=byId[l.id];return{name:pname(p),sub:`${t(p.cut)} · ${t('pairs',p.pairs)}`,price:p.price,ph:`<span class="ph"><img src="${l.sw?img(p,l.sw):img(p,'g')}" alt=""></span>`};
}
const bagQty=()=>S.bag.reduce((a,l)=>a+l.qty,0), bagSum=()=>S.bag.reduce((a,l)=>a+lineInfo(l).price*l.qty,0);
function bump(el,n){el.hidden=!n;el.textContent=n;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),300)}
function bagChanged(){persist();bump($('#bagCount'),bagQty());if($('#drawer').classList.contains('on'))renderDrawer()}
function savedChanged(){persist();bump($('#savedCount'),S.saved.size);$$('[data-save]').forEach(b=>b.setAttribute('aria-pressed',S.saved.has(b.dataset.save)));if($('#drawer').classList.contains('on'))renderDrawer()}
function toggleSave(id,btn){
  if(S.saved.has(id)){S.saved.delete(id);savedChanged();toast(t('unsaved'),t('undo'),()=>{S.saved.add(id);savedChanged()})}
  else{S.saved.add(id);savedChanged();toast(t('savedToast'),t('view'),()=>openDrawer('saved'))}
  if(btn){btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop')}
}
let dTab='bag';
function renderDrawer(){
  $('#drawerTitle').textContent=dTab==='bag'?t('bagT'):t('savedT');
  $('#tabBag').textContent=t('bagTab',bagQty());$('#tabSaved').textContent=t('savedTab',S.saved.size);
  $('#tabBag').setAttribute('aria-selected',dTab==='bag');$('#tabSaved').setAttribute('aria-selected',dTab==='saved');
  const sugg=`<div class="mini">${['op3c-p-2','op3w-p-2','op3g-p-1'].map(id=>{const p=byId[id];return `<button data-qv="${id}"><span class="ph"><img src="${img(p,'g')}" alt=""></span>${pname(p)}</button>`}).join('')}</div>`;
  if(dTab==='bag'){
    const sum=bagSum(),need=Math.max(0,600-sum);
    $('#dbody').innerHTML=S.bag.length?`<div class="ship"><span>${need?t('away',need):t('freeOn')}</span><div class="track"><i style="width:${Math.min(100,sum/6)}%"></i></div></div>`+S.bag.map(l=>{const i=lineInfo(l);return `<div class="line">${i.ph}<div><b>${i.name}</b><small>${i.sub}</small><span class="qty"><button data-dec="${l.key}" aria-label="-">−</button><span>${l.qty}</span><button data-inc="${l.key}" aria-label="+">+</button></span><button class="rm" data-rml="${l.key}">${t('remove')}</button></div><span class="price">${money(i.price*l.qty)}</span></div>`}).join('')
      :`<div class="dempty"><b>${t('emptyBag')}</b><span>${t('emptyHint')}</span>${sugg}</div>`;
    $('#dfoot').innerHTML=S.bag.length?`<div class="tot"><span>${t('subtotal')}</span><span>${money(sum)}</span></div><button class="btn red" id="checkout">${t('checkout')}</button><p class="note" id="coNote" hidden>${t('checkoutNote')}</p>`:'';
  }else{
    const ids=[...S.saved].filter(id=>byId[id]);
    $('#dbody').innerHTML=ids.length?ids.map(id=>{const p=byId[id];return `<div class="line"><span class="ph"><img src="${img(p,'g')}" alt=""></span><div><b>${pname(p)}</b><small>${t(p.cut)} · ${t('pairs',p.pairs)}</small><button class="btn" style="min-height:36px;padding:0 14px;font-size:13px;margin-top:8px" data-add="${id}">${t('moveToBag')}</button><button class="rm" data-save="${id}">${t('remove')}</button></div><span class="price">${money(p.price)}</span></div>`}).join('')
      :`<div class="dempty"><b>${t('emptySaved')}</b><span>${t('emptyHint')}</span>${sugg}</div>`;
    $('#dfoot').innerHTML='';
  }
}
$('#drawer').addEventListener('click',e=>{
  const f=(a)=>S.bag.find(l=>l.key===e.target.closest(`[${a}]`).getAttribute(a));
  if(e.target.closest('#tabBag')){dTab='bag';renderDrawer()}
  else if(e.target.closest('#tabSaved')){dTab='saved';renderDrawer()}
  else if(e.target.closest('[data-inc]')){f('data-inc').qty++;bagChanged()}
  else if(e.target.closest('[data-dec]')){const l=f('data-dec');l.qty--;if(!l.qty)S.bag=S.bag.filter(x=>x!==l);bagChanged()}
  else if(e.target.closest('[data-rml]')){const l=f('data-rml'),i=S.bag.indexOf(l);S.bag.splice(i,1);bagChanged();toast(t('remove'),t('undo'),()=>{S.bag.splice(i,0,l);bagChanged()})}
  else if(e.target.closest('#checkout')){$('#coNote').hidden=false}
});

/* ---------- quick view ---------- */
let qv=null;
function openQV(id,sw=0){
  const p=byId[id];qv={id,sw,qty:1};
  const shots=['g',...p.sw.map((_,i)=>i+1),...(p.pack?['p']:[])];
  const show=sw||'g';
  $('#mbox').innerHTML=`<button class="icon-btn x" data-close data-ta="close" aria-label="${t('close')}"><svg><use href="#i-x"/></svg></button>
  <div class="gal"><div class="main"><img id="qvImg" src="${img(p,show)}" alt="${pname(p)}"></div><div class="thumbs">${shots.map(k=>`<button data-shot="${k}" aria-pressed="${k==show}"><img src="${img(p,k)}" alt=""></button>`).join('')}</div></div>
  <div class="info">
    ${p.badge?`<span class="badge ${p.badge}" style="position:static;justify-self:start">${t(p.badge)}</span>`:''}
    <h2 id="qvName">${pname(p)}</h2><p class="sub">${t(p.who)} · ${t(p.cut)} · ${t('pairs',p.pairs)}</p>
    <span class="price${p.full?' sale':''}">${p.full?`<s>${money(p.full)}</s>`:''}${money(p.price)}</span>
    <p style="margin:0;color:var(--muted)">${t('d_'+p.cut)}</p>
    <div><span class="lbl">${t('chooseColour')}</span><div class="sw">${p.sw.map((c,i)=>`<button style="background:${c}" data-qsw="${i+1}" aria-pressed="${sw==i+1}" aria-label="${i+1}"></button>`).join('')}</div></div>
    <div><span class="lbl">${t('qty')}</span><div class="buy"><span class="qty"><button data-qd aria-label="-">−</button><span id="qvQty">1</span><button data-qi aria-label="+">+</button></span><button class="btn red" data-qadd>${t('addToBag')} · <span id="qvTot">${money(p.price)}</span></button><button class="icon-btn heart" style="position:static;background:var(--tile)" data-save="${p.id}" aria-pressed="${S.saved.has(p.id)}" aria-label="${t('saved')}"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg></button></div></div>
    <div><details open><summary>${t('fabric')}</summary><p>${t('fabricT')}</p></details><details><summary>${t('care')}</summary><p>${t('careT')}</p></details><details><summary>${t('shipping')}</summary><p>${t('shipT')}</p></details></div>
  </div>`;
  open('#modal');setTimeout(()=>$('#mbox .x').focus(),50);
}
$('#modal').addEventListener('click',e=>{
  if(e.target===e.currentTarget){closeAll();return}
  if(!qv)return;const p=byId[qv.id];
  const sh=e.target.closest('[data-shot]');if(sh){$('#qvImg').src=img(p,sh.dataset.shot);$('#qvImg').classList.toggle('pack',sh.dataset.shot==='p');$$('[data-shot]').forEach(b=>b.setAttribute('aria-pressed',b===sh));const n=+sh.dataset.shot;if(n){qv.sw=n;$$('[data-qsw]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.qsw===n))}return}
  const q=e.target.closest('[data-qsw]');if(q){qv.sw=+q.dataset.qsw;$('#qvImg').src=img(p,qv.sw);$('#qvImg').classList.remove('pack');$$('[data-qsw]').forEach(b=>b.setAttribute('aria-pressed',b===q));$$('[data-shot]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.shot==qv.sw));return}
  if(e.target.closest('[data-qi]'))qv.qty=Math.min(20,qv.qty+1);
  if(e.target.closest('[data-qd]'))qv.qty=Math.max(1,qv.qty-1);
  $('#qvQty').textContent=qv.qty;$('#qvTot').textContent=money(p.price*qv.qty);
  if(e.target.closest('[data-qadd]')){addToBag(qv.id,qv.sw,qv.qty);closeAll()}
});

/* ---------- overlays ---------- */
let lastFocus=null;
function open(sel){lastFocus=document.activeElement;closeAll(true);$(sel).classList.add(sel==='#search'?'open':'on');if(sel!=='#search')$('#scrim').classList.add('on');document.body.classList.add('lock')}
function closeAll(keepFocus){closePop();['#drawer','#mmenu','#modal','#scrim'].forEach(s=>$(s).classList.remove('on'));$('#search').classList.remove('open');closeMega();document.body.classList.remove('lock');if(!keepFocus&&lastFocus&&lastFocus.focus)lastFocus.focus()}
function openDrawer(tab){dTab=tab;renderDrawer();open('#drawer');setTimeout(()=>$('#drawer [data-close]').focus(),50)}
$('#scrim').onclick=()=>closeAll();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$('#openBag').onclick=()=>openDrawer('bag');$('#openSaved').onclick=()=>openDrawer('saved');
$('#burger').onclick=()=>{renderMobile();open('#mmenu')};

/* ---------- mega menu ---------- */
let megaFor=null,megaT=null;
function renderMega(w){
  const list=P.filter(p=>p.who===w),feat=list.filter(p=>p.badge==='best'||p.badge==='new').slice(0,2);while(feat.length<2)feat.push(list[feat.length]);
  const cuts=CUTS.filter(c=>list.some(p=>p.cut===c));
  $('#megaIn').innerHTML=`<div><h4>${t('megaCuts')}</h4><ul>${cuts.map(c=>`<li><button data-mgo="${w}|${c}">${t(c)}<small>${list.filter(p=>p.cut===c).length}</small></button></li>`).join('')}<li><button data-mgo="${w}|">${t('allOf',t(w))}<small>${list.length}</small></button></li></ul></div>
  ${feat.map(p=>`<button class="feat" data-qv="${p.id}"><span class="ph"><img src="${img(p,'g')}" alt=""></span><b>${pname(p)}</b><span>${t('pairs',p.pairs)} · ${money(p.price)}</span></button>`).join('')}
  <a class="promo" href="#build"><img src="${img(byId[w==='kids'?'op3n-120':w==='women'?'op3i-p-1':'op3c-p-1'],'p')}" alt=""><div><b>${t('megaPromo')}</b><span>${t('megaPromoS')}</span></div></a>`;
}
function openMega(w){clearTimeout(megaT);if(megaFor!==w){renderMega(w);megaFor=w}$('#mega').classList.add('open');$$('[data-mega]').forEach(b=>b.setAttribute('aria-expanded',b.dataset.mega===w))}
function closeMega(){$('#mega').classList.remove('open');$$('[data-mega]').forEach(b=>b.setAttribute('aria-expanded','false'));megaFor=null}
$$('[data-mega]').forEach(b=>{b.addEventListener('mouseenter',()=>openMega(b.dataset.mega));b.addEventListener('click',()=>b.getAttribute('aria-expanded')==='true'?closeMega():openMega(b.dataset.mega))});
$('#hdr').addEventListener('mouseleave',()=>{megaT=setTimeout(closeMega,180)});
$('#mega').addEventListener('mouseenter',()=>clearTimeout(megaT));
$('#mega').addEventListener('click',e=>{const m=e.target.closest('[data-mgo]');if(m){const[w,c]=m.dataset.mgo.split('|');S.who=w;S.cut.clear();S.pack.clear();S.fam.clear();if(c)S.cut.add(c);renderShop();closeMega();$('#shop').scrollIntoView({behavior:'smooth'})}
  if(e.target.closest('a.promo'))closeMega()});

function renderMobile(){
  $('#mlist').innerHTML=['men','women','kids'].map(w=>`<button data-go="${w}">${t(w)}<span>›</span></button><div class="sub">${CUTS.filter(c=>P.some(p=>p.who===w&&p.cut===c)).map(c=>`<button class="chip" data-mgo2="${w}|${c}">${t(c)}</button>`).join('')}</div>`).join('')+
  `<button data-go="packs">${t('valuePacks')}<span>›</span></button><a href="#build" class="chip" style="margin-top:14px;justify-self:start" onclick="closeAll()">${t('buildNav')}</a><a href="#guide" class="chip" style="justify-self:start" onclick="closeAll()">${t('guideNav')}</a>`;
}
$('#mlist').addEventListener('click',e=>{const m=e.target.closest('[data-mgo2]');if(m){const[w,c]=m.dataset.mgo2.split('|');S.who=w;S.cut.clear();S.pack.clear();S.fam.clear();S.cut.add(c);renderShop();closeAll();$('#shop').scrollIntoView({behavior:'smooth'})}});

/* ---------- search ---------- */
const POP=['crew','noshow','navy','colour','women','kids'];
function renderSearch(){
  const q=$('#q').value.trim().toLowerCase();
  $('#pop').innerHTML=`<span class="count" style="align-self:center;margin-inline-end:4px">${t('popular')}</span>`+POP.map(k=>`<button class="chip" data-pq="${k}">${k==='colour'?famLabel('colour'):t(k)}</button>`).join('');
  if(!q){$('#results').innerHTML='';return}
  const hit=P.filter(p=>[p.en,p.ar,t(p.cut),T.en[p.cut],p.cut,t(p.who),p.who,...p.fam,...p.fam.map(famLabel),T.en.pairs(p.pairs)].join(' ').toLowerCase().includes(q));
  $('#results').innerHTML=hit.length?hit.map(p=>`<button class="res" data-qv="${p.id}"><span class="ph"><img src="${img(p,'g')}" alt=""></span><b>${pname(p)}</b><span>${t(p.who)} · ${t(p.cut)} · ${money(p.price)}</span></button>`).join(''):`<p class="count">${t('noResults')}</p>`;
}
$('#openSearch').onclick=()=>{open('#search');renderSearch();setTimeout(()=>$('#q').focus(),60)};
$('#closeSearch').onclick=()=>closeAll();
$('#q').oninput=renderSearch;
$('#search').addEventListener('click',e=>{if(e.target===e.currentTarget)closeAll();const k=e.target.closest('[data-pq]');if(k){$('#q').value=k.dataset.pq==='colour'?famLabel('colour'):t(k.dataset.pq);renderSearch()}});

/* ---------- global delegation ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeAll();return}
  const s=e.target.closest('[data-save]');if(s){e.stopPropagation();toggleSave(s.dataset.save,s.classList.contains('heart')?s:null);return}
  const a=e.target.closest('[data-add]');if(a){e.stopPropagation();addToBag(a.dataset.add);return}
  const q=e.target.closest('[data-qv]');if(q&&!e.target.closest('[data-sw]')){const cd=q.closest('.card'),sel=cd&&cd.querySelector('[data-sw][aria-pressed="true"]');openQV(q.dataset.qv,sel?+sel.dataset.sw:0);return}
  const g=e.target.closest('[data-go]');if(g){goShop(g.dataset.go);return}
});

/* ---------- toast ---------- */
let toastT=null,toastFn=null;
function toast(msg,act,fn){$('#toastText').textContent=msg;const b=$('#toastAct');b.textContent=act||'';b.hidden=!act;toastFn=fn;$('#toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('on'),3200)}
$('#toastAct').onclick=()=>{$('#toast').classList.remove('on');toastFn&&toastFn()};

/* ---------- newsletter ---------- */
$('#newsForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#email').value.trim(),m=$('#newsMsg');
  if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){m.textContent=t('newsOk');m.className='msg ok';$('#email').value=''}else{m.textContent=t('newsErr');m.className='msg err';$('#email').focus()}});

/* ---------- header state ---------- */
addEventListener('scroll',()=>$('#hdr').classList.toggle('scrolled',scrollY>8),{passive:true});

/* ---------- language ---------- */
function renderAll(){applyStatic();bar();renderHero();renderCats();renderShop();renderGuide();renderBuilder();renderFacts();bump($('#bagCount'),bagQty());bump($('#savedCount'),S.saved.size);if(megaFor){const w=megaFor;megaFor=null;renderMega(w);megaFor=w}if($('#drawer').classList.contains('on'))renderDrawer();if($('#search').classList.contains('open'))renderSearch();restart()}
$('#lang').onclick=()=>{const r=document.documentElement;r.classList.add('no-anim');lang=lang==='en'?'ar':'en';persist();renderAll();void r.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>r.classList.remove('no-anim')))};
renderAll();
</script>
